const out = document.querySelector('#out');
const log = m => out.textContent += "\n" + m;
async function req(path, opt={}) {
  const t = document.querySelector('#token').value;
  const r = await fetch('https://api.github.com'+path, {...opt, headers:{Accept:'application/vnd.github+json', Authorization:'Bearer '+t, 'X-GitHub-Api-Version':'2022-11-28', ...(opt.headers||{})}});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Error(path+' '+r.status+' '+(j.message||''));
  return j;
}
document.querySelector('#go').onclick = async () => {
  out.textContent = 'pushing...';
  try {
    for (const f of FILES) {
      let sha;
      try { sha = (await req('/repos/aeiouvcode/open-muse/contents/'+f.path)).sha; } catch(e) {}
      await req('/repos/aeiouvcode/open-muse/contents/'+f.path, {method:'PUT', body: JSON.stringify({message:'Publish Open Muse ('+f.path+')', content:f.b64, branch:'main', ...(sha?{sha}:{})})});
      log('pushed '+f.path);
    }
    log('ALL DONE');
  } catch(e) { log('ERROR '+e.message); }
  finally { document.querySelector('#token').value=''; }
};
