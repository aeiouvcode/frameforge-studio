  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw Error(path+' '+r.status+' '+(j.message||''));
  return j;
}
document.querySelector('#go').onclick = async () => {
  out.textContent = 'pushing...';
  try {
    for (const f of FILES) {
      let sha;
      try { sha = (await req('/repos/aeiouvcode/open-muse/contents/'+f.path)).sha; } catch(e) {}
      await req('/repos/aeiouvcode/open-muse/contents/'+f.path, {method:'PUT', body: JSON.stringify({message:'Publish Open Muse ('+f.path+')', content:f.b64, branch:'main', ...(sha?{sha}:{})})});
      log('pushed '+f.path);
    }
    log('ALL DONE');
  } catch(e) { log('ERROR '+e.message); }
  finally { document.querySelector('#token').value=''; }
};
