<!doctype html><meta charset=utf-8><body style="background:#111;color:#ddd;font:12px monospace">
<canvas id=src width=1280 height=720></canvas><br><canvas id=a width=256 height=128></canvas> <canvas id=b width=256 height=128></canvas><pre id=o></pre>
<script src="../core/ff-scopes.js"></script><script src="scope-gpu.js"></script>
<script>
const s=document.getElementById('src'),x=s.getContext('2d');
function frame(t){ // bars + gradients + moving shapes
  const bars=['#c0c0c0','#c0c000','#00c0c0','#00c000','#c000c0','#c00000','#0000c0'];
  bars.forEach((c,i)=>{x.fillStyle=c;x.fillRect(i*1280/7,0,1280/7+1,360)});
  const g=x.createLinearGradient(0,0,1280,0);g.addColorStop(0,'#000');g.addColorStop(1,'#fff');x.fillStyle=g;x.fillRect(0,360,1280,180);
  const h=x.createLinearGradient(0,0,1280,0);['#f00','#ff0','#0f0','#0ff','#00f','#f0f','#f00'].forEach((c,i)=>h.addColorStop(i/6,c));x.fillStyle=h;x.fillRect(0,540,1280,180);
  x.fillStyle='#e8b090';x.beginPath();x.arc(640+300*Math.sin(t),450,120,0,7);x.fill();
}
window.bench=async(mode,N=60)=>{
  const cpu=ffScopes.makeCpu(),gpu=ffScopes.makeGpu(),A=document.getElementById('a'),B=document.getElementById('b');
  const info={gl:null};
  if(gpu){const gl=document.createElement('canvas').getContext('webgl2');const e=gl.getExtension('WEBGL_debug_renderer_info');info.gl=e?gl.getParameter(e.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);info.floatAcc=gpu.floatAcc}
  const time=(f)=>{for(let i=0;i<5;i++){frame(i);f()}const ts=[];for(let i=0;i<N;i++){frame(i*.1);const t0=performance.now();f();ts.push(performance.now()-t0)}ts.sort((a,b)=>a-b);return {med:+ts[N>>1].toFixed(2),p90:+ts[Math.floor(N*.9)].toFixed(2)}};
  info.cpu=time(()=>{cpu.render(s,A,mode);A.getContext('2d').getImageData(0,0,1,1)});
  if(gpu)info.gpu=time(()=>{gpu.render(s,B,mode);B.getContext('2d').getImageData(0,0,1,1)});
  if(gpu){frame(1.3);cpu.render(s,A,mode);gpu.render(s,B,mode);const p=A.getContext('2d').getImageData(0,0,256,128).data,q=B.getContext('2d').getImageData(0,0,256,128).data;let d=0,tot=0,big=0;for(let i=0;i<p.length;i+=4){const e=Math.abs(p[i+2]-q[i+2]);d+=e;tot+=p[i+2];if(e>32)big++}info.parity={relL1:+(d/Math.max(1,tot)).toFixed(4),px_over32:big}}
  return JSON.stringify(info)
};
</script>
